<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERWORLD MMORPG // FURIOS-INT</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            border: 4px solid #00e8ff;
            box-shadow: 0 0 20px #00e8ff;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00e8ff;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div>SYSTEM: FURIOS-INT NODE 2.1</div>
        <div>UPLINK: STABLE</div>
    </div>
    <div id="game-container"></div>
    <script src="src/main.js" type="module"></script>
</body>
</html>
